<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <!-- Deep Water Sphere Gradient -->
    <radialGradient id="sphereGrad" cx="38%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#b6f4ff"/>
      <stop offset="25%" stop-color="#38b6ff"/>
      <stop offset="65%" stop-color="#0077c8"/>
      <stop offset="90%" stop-color="#004c8f"/>
      <stop offset="100%" stop-color="#002d59"/>
    </radialGradient>
    
    <!-- Top-left Specular Crescent Reflection -->
    <linearGradient id="specularWhite" x1="0%" y1="0%" x2="50%" y2="80%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="85%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Bottom Rim Caustic Glow -->
    <radialGradient id="causticRim" cx="50%" cy="85%" r="50%">
      <stop offset="0%" stop-color="#55e6c1" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#00a8ff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#004c8f" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadow -->
    <filter id="orbShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#004c8f" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Ambient Outer Glow -->
  <circle cx="150" cy="150" r="128" fill="#5ce1e6" opacity="0.3" filter="blur(14px)"/>

  <!-- Main 3D Glossy Water Bubble -->
  <circle cx="150" cy="150" r="120" fill="url(#sphereGrad)" filter="url(#orbShadow)"/>

  <!-- Bottom Caustic Reflection -->
  <circle cx="150" cy="150" r="120" fill="url(#causticRim)"/>

  <!-- Mound of Soil/Earth inside Sphere -->
  <ellipse cx="150" cy="192" rx="42" ry="16" fill="#6d4c41"/>
  <ellipse cx="150" cy="189" rx="36" ry="12" fill="#8d6e63"/>
  <ellipse cx="150" cy="187" rx="28" ry="8" fill="#a1887f" opacity="0.6"/>

  <!-- Vibrant Sprouting Green Seedling (Plant) -->
  <!-- Stem -->
  <path d="M 150 186 Q 151 155 147 136" fill="none" stroke="#2ecc71" stroke-width="7" stroke-linecap="round"/>
  <path d="M 150 186 Q 151 155 147 136" fill="none" stroke="#a8ff78" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Left Leaf -->
  <path d="M 147 146 C 122 142 110 120 126 108 C 144 112 148 132 147 146 Z" fill="#2ecc71" stroke="#27ae60" stroke-width="1.5"/>
  <path d="M 147 146 C 132 140 124 126 130 115" fill="none" stroke="#a8ff78" stroke-width="1.5"/>
  <!-- Leaf Specular Highlight -->
  <ellipse cx="132" cy="124" rx="7" ry="4" fill="#ffffff" opacity="0.6" transform="rotate(-25 132 124)"/>

  <!-- Right Leaf (Slightly larger, glossy) -->
  <path d="M 148 142 C 172 136 186 112 168 100 C 150 106 146 128 148 142 Z" fill="#27ae60" stroke="#1e8449" stroke-width="1.5"/>
  <path d="M 148 142 C 160 134 170 120 162 108" fill="none" stroke="#a8ff78" stroke-width="1.5"/>
  <!-- Leaf Specular Highlight -->
  <ellipse cx="164" cy="116" rx="8" ry="4" fill="#ffffff" opacity="0.7" transform="rotate(30 164 116)"/>

  <!-- Specular Crescent Gloss (The Frutiger Aero signature shine) -->
  <ellipse cx="118" cy="98" rx="48" ry="24" fill="url(#specularWhite)" transform="rotate(-38 118 98)"/>
  <circle cx="82" cy="148" r="8" fill="#ffffff" opacity="0.65"/>
  <circle cx="95" cy="172" r="4" fill="#ffffff" opacity="0.45"/>
  
  <!-- Subtle secondary bottom rim highlight -->
  <path d="M 90 220 A 118 118 0 0 0 210 220" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.45" stroke-linecap="round"/>
</svg>