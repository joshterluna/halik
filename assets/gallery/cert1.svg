<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffdf5"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fff6db"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Frame -->
  <rect width="600" height="400" rx="16" fill="url(#bgGold)" stroke="#d4af37" stroke-width="7"/>
  <rect x="16" y="16" width="568" height="368" rx="12" fill="none" stroke="#aa8c2c" stroke-width="1.5"/>
  <rect width="600" height="170" rx="16" fill="url(#gloss)"/>

  <g transform="translate(300, 80)">
    <circle cx="0" cy="0" r="38" fill="linear-gradient(135deg, #f39c12, #d35400)" stroke="#ffffff" stroke-width="3"/>
    <text x="0" y="8" font-size="26" text-anchor="middle">📜</text>
  </g>

  <text x="300" y="145" font-family="'Georgia', serif" font-size="24" font-weight="bold" fill="#78590c" text-anchor="middle">CERTIFICATE OF PUBLICATION</text>
  <text x="300" y="172" font-family="'Segoe UI', Arial, sans-serif" font-size="12" letter-spacing="2" fill="#997300" text-anchor="middle">INTERNATIONAL PEER-REVIEWED JOURNAL</text>
  
  <text x="300" y="210" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#444444" text-anchor="middle">This is to certify that the collaborative research paper entitled:</text>
  <text x="300" y="235" font-family="'Georgia', serif" font-size="14" font-weight="bold" fill="#003366" text-anchor="middle">"MosquiTect: A Multi-Sensor Automated System for Mosquito Detection"</text>
  <text x="300" y="260" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#333333" text-anchor="middle">was officially published in the International Journal of Scientific Research and Engineering Trends</text>

  <line x1="80" y1="305" x2="520" y2="305" stroke="#d4af37" stroke-width="1"/>
  <text x="140" y="340" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#78590c">Date: February 5, 2026</text>
  <text x="460" y="340" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="bold" fill="#003366" text-anchor="end">IJSRET Editorial Board</text>
</svg>