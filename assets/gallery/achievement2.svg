  <rect width="600" height="400" rx="16" fill="url(#certBg2)" stroke="#2ecc71" stroke-width="6"/>
  <rect x="15" y="15" width="570" height="370" rx="12" fill="none" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="8 4"/>
