  <text x="300" y="165" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="bold" fill="#1b4d3e" text-anchor="middle">STEM RESEARCH &amp; INNOVATION</text>
  <text x="300" y="195" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600" fill="#27ae60" text-anchor="middle">Carlos P. Garcia Senior High School • 2024–2026</text>
  <text x="300" y="235" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#2c3e50" text-anchor="middle">Completed Senior High School Science &amp; Technology Track</text>
