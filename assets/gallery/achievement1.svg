<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="certBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eaf8ff"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d7f3fe"/>
    </linearGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1c40f"/>
      <stop offset="50%" stop-color="#00aaff"/>
      <stop offset="100%" stop-color="#0066cc"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="16" fill="url(#certBg)" stroke="url(#goldBorder)" stroke-width="6"/>
  <rect x="15" y="15" width="570" height="370" rx="12" fill="none" stroke="#0088cc" stroke-width="1.5" stroke-dasharray="8 4"/>
  <rect width="600" height="180" rx="16" fill="url(#gloss)"/>

  <!-- Seal / Badge -->
  <g transform="translate(300, 90)">
    <circle cx="0" cy="0" r="42" fill="linear-gradient(135deg, #0099ff, #004488)" stroke="#ffffff" stroke-width="3"/>
    <text x="0" y="8" font-size="28" text-anchor="middle">🏆</text>
  </g>

  <text x="300" y="165" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="bold" fill="#003366" text-anchor="middle">RESEARCH PUBLICATION MILESTONE</text>
  <text x="300" y="195" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600" fill="#0088cc" text-anchor="middle">International Journal of Scientific Research and Engineering Trends</text>
  <text x="300" y="235" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#2c3e50" text-anchor="middle">Lead Hardware Assembly &amp; Surveillance Telemetry Co-Author</text>
  <text x="300" y="260" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="bold" fill="#005588" text-anchor="middle">"MosquiTect: Automated Multi-Sensor System"</text>

  <!-- Bottom Metadata -->
  <line x1="80" y1="310" x2="520" y2="310" stroke="#b0d8ef" stroke-width="1.5"/>
  <text x="120" y="340" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#5588a3">Published: February 5, 2026</text>
  <text x="480" y="340" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="bold" fill="#0088cc" text-anchor="end">IJSRET Academic Archive</text>
</svg>