<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="certBg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f0ff"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2d4ff"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="16" fill="url(#certBg3)" stroke="#8e44ad" stroke-width="6"/>
  <rect x="15" y="15" width="570" height="370" rx="12" fill="none" stroke="#9b59b6" stroke-width="1.5" stroke-dasharray="8 4"/>
  <rect width="600" height="180" rx="16" fill="url(#gloss)"/>

  <!-- Badge -->
  <g transform="translate(300, 90)">
    <circle cx="0" cy="0" r="42" fill="linear-gradient(135deg, #9b59b6, #6c5ce7)" stroke="#ffffff" stroke-width="3"/>
