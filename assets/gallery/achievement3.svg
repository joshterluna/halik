  </g>

  <text x="300" y="165" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="bold" fill="#4a235a" text-anchor="middle">COLLEGIATE MATRICULATION MILESTONE</text>
  <text x="300" y="195" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600" fill="#8e44ad" text-anchor="middle">University of Immaculate Conception • 2026</text>
  <text x="300" y="235" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#2c3e50" text-anchor="middle">Bachelor of Science in Information Technology (BSIT)</text>
  <text x="300" y="260" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="bold" fill="#5b2c6f" text-anchor="middle">1st Year IT Student Journey Commenced</text>

  <line x1="80" y1="310" x2="520" y2="310" stroke="#d7bde2" stroke-width="1.5"/>
  <text x="120" y="340" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#8e44ad">Status: Enrolled &amp; Active</text>
  <text x="480" y="340" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="bold" fill="#6c5ce7" text-anchor="end">BSIT Department</text>
